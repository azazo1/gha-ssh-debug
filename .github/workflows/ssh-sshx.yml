name: SSH Debug sshx

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start sshx session
        run: |
          set -euo pipefail
          curl -sSf https://sshx.io/get | sh -s download
          chmod +x ./sshx
          ./sshx --help > sshx-help.txt 2>&1 || true
          ./sshx > sshx.log 2>&1 &
          echo $! > sshx.pid
          for i in $(seq 1 60); do
            if grep -E 'https://' sshx.log >/dev/null 2>&1; then
              grep -Eo 'https://[^ ]+' sshx.log | head -n 1 > ssh.txt
              echo "sshx url:"
              cat ssh.txt
              echo "sshx log:"
              cat sshx.log
              echo "sshx help:"
              cat sshx-help.txt
              exit 0
            fi
            sleep 1
          done
          echo "sshx did not print a URL in time"
          cat sshx.log || true
          cat sshx-help.txt || true
          exit 1

      - name: Upload connection info
        uses: actions/upload-artifact@v4
        with:
          name: sshx-connection
          path: |
            ssh.txt
            sshx.log
            sshx-help.txt
          if-no-files-found: error

      - name: Wait for continue marker
        run: |
          until [ -f continue ]; do
            sleep 5
          done
