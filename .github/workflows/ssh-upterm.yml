name: SSH Debug Upterm

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          detached: true
          wait-timeout-minutes: 15

      - name: Save connection info
        run: |
          echo "${{ steps.upterm.outputs.ssh-command }}" > ssh.txt
          cat ssh.txt

      - name: Upload connection info
        uses: actions/upload-artifact@v4
        with:
          name: upterm-connection
          path: ssh.txt
          if-no-files-found: error

      - name: Wait for continue marker
        run: |
          until [ -f continue ]; do
            sleep 5
          done
