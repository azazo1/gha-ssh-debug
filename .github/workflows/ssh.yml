name: SSH Debug

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Magic Wormhole
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew install --quiet magic-wormhole
          wormhole --version

      - name: Start tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        with:
          limit-access-to-actor: true
          detached: true
          connect-timeout-seconds: 1800

      - name: Save connection info
        run: |
          echo "${{ steps.tmate.outputs.ssh-command }}" > ssh.txt
          echo "${{ steps.tmate.outputs.web-url }}" > web.txt

      - name: Upload connection info
        uses: actions/upload-artifact@v4
        with:
          name: tmate-connection
          path: |
            ssh.txt
            web.txt
          if-no-files-found: warn

      - name: Wait for continue marker
        run: |
          until [ -f continue ] || [ ! -e /tmp/tmate.sock ]; do
            sleep 5
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/
            dist/
          if-no-files-found: warn
